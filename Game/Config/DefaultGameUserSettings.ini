[ScalabilityGroups]
; Iris Xe presentation profile: these match the settings every FPS figure and visual check was made with
; (shadows/post/effects at 2 drop the packaged build from ~100 to ~37 fps)
sg.ResolutionQuality=0
sg.ViewDistanceQuality=2
sg.AntiAliasingQuality=2
sg.ShadowQuality=0
sg.GlobalIlluminationQuality=1
sg.ReflectionQuality=0
sg.PostProcessQuality=0
sg.TextureQuality=2
sg.EffectsQuality=0
sg.FoliageQuality=1
sg.ShadingQuality=2
