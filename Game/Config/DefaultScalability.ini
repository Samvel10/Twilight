; Iris Xe presentation profile. DefaultGameUserSettings keeps sg.Shadow/Reflection/PostProcess/Effects at 0;
; these @0 buckets are overridden so the realism features measured as cheap come back
; (docs/research: shadows +1.7 ms, post +0.5 ms, effects ~0 ms; ~80 fps measured).

[ShadowQuality@0]
r.ShadowQuality=3
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxResolution=1024
r.Shadow.MaxCSMResolution=1024
r.Shadow.DistanceScale=1.0
r.Shadow.CSM.TransitionScale=0.5

[PostProcessQuality@0]
r.LightShaftQuality=1
r.Tonemapper.Quality=5
r.Tonemapper.Sharpen=0.5
r.LensFlareQuality=2
r.SceneColorFringeQuality=1
r.BloomQuality=5
r.Bloom.ScreenPercentage=50

[EffectsQuality@0]
r.MaterialQualityLevel=1
r.EmitterSpawnRateScale=0.5
r.SkyAtmosphere.SampleCountMax=32
r.SkyAtmosphere.FastSkyLUT.SampleCountMax=32
r.SkyAtmosphere.AerialPerspectiveLUT.DepthResolution=16.0
r.SkyAtmosphere.TransmittanceLUT.UseSmallFormat=0
